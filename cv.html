      get: (code) => locales[code] || locales[fallbackLocale]
    });

    const createSafeStorage = (key) => ({
      read: () => {
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      },
      write: (value) => {
        try {
          window.localStorage.setItem(key, value);
        } catch (error) {
          // File:// and strict privacy modes can deny localStorage; the CV still works.
        }
      }
    });

    const createCvViewModel = ({ repository, storage }) => {
      const pickBrowserLocale = () => (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : repository.fallbackLocale;
      const normalizeLocale = (code) => repository.hasLocale(code) ? code : repository.fallbackLocale;
      const locale = ref(normalizeLocale(storage.read() || pickBrowserLocale()));
      const copy = computed(() => repository.get(locale.value));
      const localeOptions = repository.listLocales();

      const setLocale = (code) => {
        locale.value = normalizeLocale(code);
        storage.write(locale.value);
      };

      const stack = computed(() => shared.stack.map((group) => ({

      const quickLinks = computed(() => shared.links.map((link) => ({

      })));

      const experience = computed(() => shared.experienceBase.map((job) => ({

        location: copy.value.locations[job.locationId],
        to: job.current ? copy.value.labels.present : job.to,
        ...copy.value.experience[job.id]
      })));

      watchEffect(() => {
        const meta = copy.value.meta;
        document.documentElement.lang = locale.value;
        document.title = meta.title;
        const description = document.querySelector('meta[name="description"]');
        if (description) {
          description.setAttribute('content', meta.description);
        }
      });

      return {
        applicationSkills: shared.skills,
        contact: shared.contact,
        copy,
        experience,
        locale,
        localeOptions,
        metrics: computed(() => copy.value.metrics),
        printCv: () => window.print(),
        quickLinks,
        setLocale,
        stack,
        strengths: computed(() => copy.value.strengths)
      };
    };

    const contentRepository = createContentRepository({
      locales: localeCopies,
      fallbackLocale: 'en'
    });

    return createCvViewModel({
      repository: contentRepository,
      storage: createSafeStorage('jcg-cv-locale')
    });
